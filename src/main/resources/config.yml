generation-radius: 1200
server-id: "server1"
export-path: "/mnt/worlds"
seeds-file: "/mnt/seeds/seeds.txt"
spawn-adjustment:
  maxSearchRadius: 100
  maxVerticalScan: 128
cage-building:
  cage-material: PURPLE_STAINED_GLASS
  cage-radius: 4
  cage-height: 3
batch-settings:
  worlds-per-batch: 10
  pause-between-batches: 60
structure-finder:
  # true: only search for the listed structures. false: search for every structure except the listed ones.
  whitelist: true
  # How far from each spawn point to search for its nearest structure, in blocks.
  search-radius: 1200
  # Structure keys, e.g. village_plains or minecraft:desert_pyramid
  structures:
    - village_plains
    - village_desert
    - village_savanna
    - village_snowy
    - village_taiga
    - desert_pyramid
    - jungle_pyramid
    - pillager_outpost
    - shipwreck
    - shipwreck_beached
    - ruined_portal
    - ruined_portal_desert
    - ruined_portal_jungle
    - ruined_portal_mountain
    - ruined_portal_ocean
    - ruined_portal_swamp
world-delay-ticks: 4